services:
  - type: web
    name: nexora-control-plane
    runtime: python
    rootDir: user-website/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PROVIDER_SHARED_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: https://nexora-unified-compute-management-platform-12oxepi7d.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app

databases:
  - name: nexora-db
    plan: free
    databaseName: nexora
    user: nexora
