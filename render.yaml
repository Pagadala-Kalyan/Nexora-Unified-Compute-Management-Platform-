services:
  - type: web
    name: nexora-control-plane
    runtime: python
    rootDir: user-website/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PROVIDER_SHARED_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: https://nexora-unified-compute-management-platform-12oxepi7d.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: MEDIAMTX_INGEST_URL
        value: rtmp://127.0.0.1:1935
      - key: MEDIAMTX_PROVIDER_READ_URL
        value: rtsp://127.0.0.1:8554
      - key: MEDIAMTX_WEBRTC_URL
        value: http://127.0.0.1:8889
      - key: MEDIA_SERVER_ALLOW_LOOPBACK
        value: "true"

databases:
  - name: nexora-db
    plan: free
    databaseName: nexora
    user: nexora
