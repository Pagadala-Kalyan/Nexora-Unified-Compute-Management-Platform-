# ============================================================
# Nexora UCMP — MediaMTX Configuration
# Real-Time Remote Live-Stream Ingest & Distribution Hub
# ============================================================

# API Configuration
api: yes
apiAddress: 127.0.0.1:9997

# Webhook Authentication. Points to the live Render control plane by default,
# or http://backend:8000 when running a fully local Docker Compose network.
authMethod: http
authHTTPAddress: https://nexora-unified-compute-management.onrender.com/stream/internal/mediamtx/auth

# Ingest & Distribution Protocols
rtmp: yes
rtmpAddress: :1935

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

# WebRTC media arrives over UDP. A larger socket buffer helps avoid drops on
# busy hosts; Linux hosts may also need net.core.rmem_max >= this value.
udpReadBufferSize: 1000000

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
# Compose may override these with the Docker host's browser-reachable address
# and the allowed frontend origins for remote browser capture.
webrtcAdditionalHosts: [127.0.0.1]
webrtcAllowOrigins: ["*"]

hls: no

# Stream paths are scoped to the per-session path generated by Nexora.
# The leading tilde enables MediaMTX regular-expression path matching.
# HTTP authentication is still authoritative for every publish/read action.
paths:
  "~^live/[A-Za-z0-9_-]+$": {}
